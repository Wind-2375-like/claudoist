<?xml version="1.0" encoding="UTF-8"?>
<!--
  Claudoist app 图标母版(1024 画布,Big Sur 规格 824 squircle 居中,边距透明)。
  三行圆形 bullet 的 todo 清单:✓ 已完成 / 大号瞄准环 + Claude 官方芒星(当前项)/ 空圈。
  芒星 path 取自 Wikimedia Commons "Claude AI symbol.svg"(简单几何标志,低于独创性门槛)。
  产物:pnpm icon:build(desktop 包内) → build/icon.icns + build/icon.png。
  渲染走 Electron 离屏(scripts/render-icon.cjs):qlmanage 会把透明边距垫成白底,
  ImageMagick 内置 SVG 渲染器不支持渐变/描边 —— 都实测踩过。
-->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F09B76"/>
      <stop offset="1" stop-color="#BC4522"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
  </g>

  <!-- 行 1:已完成 -->
  <g>
    <circle cx="308" cy="258" r="56" fill="#FFFFFF"/>
    <path d="M 285 260 L 301 278 L 333 240" fill="none" stroke="#C2502D"
          stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="424" y="228" width="296" height="60" rx="30" fill="#FFFFFF" opacity="0.72"/>
  </g>

  <!-- 行 2(主角):瞄准镜 = 环 + 四向凸出刻度(用户参考图样式)+ Claude 官方芒星 -->
  <g>
    <circle cx="308" cy="512" r="118" fill="none" stroke="#FFFFFF" stroke-width="20"/>
    <g stroke="#FFFFFF" stroke-width="30" stroke-linecap="round">
      <line x1="308" y1="416" x2="308" y2="370"/>
      <line x1="404" y1="512" x2="450" y2="512"/>
      <line x1="308" y1="608" x2="308" y2="654"/>
      <line x1="212" y1="512" x2="166" y2="512"/>
    </g>
    <path transform="translate(243.5 436.5) scale(1.45)" fill="#FFFFFF" d="m19.6 66.5 19.7-11 .3-1-.3-.5h-1l-3.3-.2-11.2-.3L14 53l-9.5-.5-2.4-.5L0 49l.2-1.5 2-1.3 2.9.2 6.3.5 9.5.6 6.9.4L38 49.1h1.6l.2-.7-.5-.4-.4-.4L29 41l-10.6-7-5.6-4.1-3-2-1.5-2-.6-4.2 2.7-3 3.7.3.9.2 3.7 2.9 8 6.1L37 36l1.5 1.2.6-.4.1-.3-.7-1.1L33 25l-6-10.4-2.7-4.3-.7-2.6c-.3-1-.4-2-.4-3l3-4.2L28 0l4.2.6L33.8 2l2.6 6 4.1 9.3L47 29.9l2 3.8 1 3.4.3 1h.7v-.5l.5-7.2 1-8.7 1-11.2.3-3.2 1.6-3.8 3-2L61 2.6l2 2.9-.3 1.8-1.1 7.7L59 27.1l-1.5 8.2h.9l1-1.1 4.1-5.4 6.9-8.6 3-3.5L77 13l2.3-1.8h4.3l3.1 4.7-1.4 4.9-4.4 5.6-3.7 4.7-5.3 7.1-3.2 5.7.3.4h.7l12-2.6 6.4-1.1 7.6-1.3 3.5 1.6.4 1.6-1.4 3.4-8.2 2-9.6 2-14.3 3.3-.2.1.2.3 6.4.6 2.8.2h6.8l12.6 1 3.3 2 1.9 2.7-.3 2-5.1 2.6-6.8-1.6-16-3.8-5.4-1.3h-.8v.4l4.6 4.5 8.3 7.5L89 80.1l.5 2.4-1.3 2-1.4-.2-9.2-7-3.6-3-8-6.8h-.5v.7l1.8 2.7 9.8 14.7.5 4.5-.7 1.4-2.6 1-2.7-.6-5.8-8-6-9-4.7-8.2-.5.4-2.9 30.2-1.3 1.5-3 1.2-2.5-2-1.4-3 1.4-6.2 1.6-8 1.3-6.4 1.2-7.9.7-2.6v-.2H49L43 72l-9 12.3-7.2 7.6-1.7.7-3-1.5.3-2.8L24 86l10-12.8 6-7.9 4-4.6-.1-.5h-.3L17.2 77.4l-4.7.6-2-2 .2-3 1-1 8-5.5Z"/>
    <rect x="480" y="480" width="276" height="64" rx="32" fill="#FFFFFF"/>
  </g>

  <!-- 行 3:待办 -->
  <g opacity="0.55">
    <circle cx="308" cy="766" r="56" fill="none" stroke="#FFFFFF" stroke-width="16"/>
    <rect x="424" y="736" width="224" height="60" rx="30" fill="#FFFFFF" opacity="0.8"/>
  </g>
</svg>
