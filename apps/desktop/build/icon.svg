<?xml version="1.0" encoding="UTF-8"?>
<!--
  Claudoist app 图标母版(1024 画布,macOS Big Sur 规格:824 squircle 居中 + 透明边距)。
  设计:三行圆形 bullet 的 todo 清单 —— ✓ 已完成 / 圆形瞄准 + Claude 星标(当前项)/ 空圈。
  底色 Claude 珊瑚橙渐变,元素纯白,dock 里醒目。
  产物:pnpm icon:build(见 scripts)→ build/icon.icns + 各尺寸 png。
-->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F09B76"/>
      <stop offset="1" stop-color="#BC4522"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>

  <!-- 底座 -->
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
  </g>

  <!-- 行 1:已完成 —— 白实心圆 + 珊瑚勾 -->
  <g>
    <circle cx="308" cy="322" r="64" fill="#FFFFFF"/>
    <path d="M 282 324 L 300 344 L 338 300" fill="none" stroke="#C2502D"
          stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="424" y="290" width="296" height="64" rx="32" fill="#FFFFFF" opacity="0.72"/>
  </g>

  <!-- 行 2:当前项 —— 圆形瞄准环 + Claude 星标(12 芒) -->
  <g>
    <circle cx="308" cy="512" r="66" fill="none" stroke="#FFFFFF" stroke-width="15"/>
    <g stroke="#FFFFFF" stroke-width="9.5" stroke-linecap="round">
      <line x1="308.0" y1="494.0" x2="308.0" y2="470.0"/>
      <line x1="317.0" y1="496.4" x2="324.5" y2="483.4"/>
      <line x1="323.6" y1="503.0" x2="344.4" y2="491.0"/>
      <line x1="326.0" y1="512.0" x2="341.0" y2="512.0"/>
      <line x1="323.6" y1="521.0" x2="344.4" y2="533.0"/>
      <line x1="317.0" y1="527.6" x2="324.5" y2="540.6"/>
      <line x1="308.0" y1="530.0" x2="308.0" y2="554.0"/>
      <line x1="299.0" y1="527.6" x2="291.5" y2="540.6"/>
      <line x1="292.4" y1="521.0" x2="271.6" y2="533.0"/>
      <line x1="290.0" y1="512.0" x2="275.0" y2="512.0"/>
      <line x1="292.4" y1="503.0" x2="271.6" y2="491.0"/>
      <line x1="299.0" y1="496.4" x2="291.5" y2="483.4"/>
    </g>
    <rect x="424" y="480" width="332" height="64" rx="32" fill="#FFFFFF"/>
  </g>

  <!-- 行 3:待办 —— 空圈 -->
  <g opacity="0.55">
    <circle cx="308" cy="702" r="64" fill="none" stroke="#FFFFFF" stroke-width="18"/>
    <rect x="424" y="670" width="224" height="64" rx="32" fill="#FFFFFF" opacity="0.8"/>
  </g>
</svg>
