# 签名 + notarization 构建(M11-B/D-38 落位;凭据在环境变量,不进仓库):
#   pnpm --filter @gtd/desktop dist:signed
# 前置(缺一不可,都在用户侧):
#   1. 钥匙串里有 Developer ID Application 证书(electron-builder 自动发现)
#   2. export APPLE_ID=… APPLE_APP_SPECIFIC_PASSWORD=… APPLE_TEAM_ID=…
#
# **独立完整配置,不 extends 基础版** —— extends 是深合并,会把基础版的
# `identity: null`(= 显式禁签)一并继承进来,签名配置就成了摆设。
# 改基础版的 files/asarUnpack 时这里要同步(两处都有注释互指)。
appId: com.windlike.claudoist
productName: Claudoist
directories:
  output: release
files:
  - out/**
asar: true
asarUnpack:
  - '**/node_modules/@anthropic-ai/**'
mac:
  target:
    - dmg
    - zip
  # identity 不写 → electron-builder 自动从钥匙串取 Developer ID Application 证书
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
npmRebuild: false
